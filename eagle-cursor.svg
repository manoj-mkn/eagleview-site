<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="outline" x="-50%" y="-50%" width="200%" height="200%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1"/>
      <feFlood flood-color="#050B14" flood-opacity="0.95"/>
      <feComposite in2="SourceAlpha" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Whole Eagle View logo, rotated 315° around its own head-tip (50,8) so
       that exact point (the eagle's head) stays fixed as the pointer tip
       while the body/wings swing around it. Head is centered at canvas
       (32,32) with generous margin so it stays fully visible at any
       rotation angle, not just the one currently chosen. -->
  <g transform="translate(13,28.96) scale(0.38) rotate(315,50,8)" filter="url(#outline)">
    <polygon points="50,8 67,40 50,35 33,40" fill="#fff"/>
    <polygon points="50,35 10,25 20,50 38,50" fill="#fff" opacity=".9"/>
    <polygon points="50,35 90,25 80,50 62,50" fill="#fff" opacity=".9"/>
    <polygon points="38,50 20,60 30,72 50,65" fill="#fff" opacity=".8"/>
    <polygon points="62,50 80,60 70,72 50,65" fill="#fff" opacity=".8"/>
    <polygon points="50,65 44,85 50,80 56,85" fill="#fff" opacity=".75"/>
  </g>
</svg>
