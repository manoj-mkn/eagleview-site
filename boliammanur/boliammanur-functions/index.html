<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>போளியம்மனூர் திருப்பணி சங்கம்</title>
<link rel="stylesheet" href="style.css?v=20260811a" />
</head>
<body>

<div id="gate">
  <div class="card">
    <img src="logo-thirupani-sangam.png" alt="போளியம்மனூர் திருப்பணி சங்கம்" class="gate-logo" />
    <p style="color:var(--muted); margin:-6px 0 8px; font-size:2rem;">Functions List</p>
    <form id="gate-form">
      <label>Password
        <input type="password" id="gate-password" required autofocus />
      </label>
      <button type="submit">Unlock</button>
      <p class="status error" id="gate-status"></p>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <div class="sticky-top-stack">
    <header>
      <h1><img src="logo-emblem-only.png" alt="" class="header-logo-main" />போளியம்மனூர் திருப்பணி சங்கம்</h1>
    </header>

    <div class="sticky-top-inner">
      <section class="card compact sheet-filter-card">
        <div class="pills-inline">
          <div class="pill-line">
            <span class="pill-label">வருடம்:</span>
            <div id="year-pills" class="pill-row"></div>
          </div>
          <span class="pill-divider"></span>
          <div class="pill-line">
            <span class="pill-label">விழா:</span>
            <div id="function-pills" class="pill-row"></div>
          </div>
        </div>
        <p class="status" id="sheet-status"></p>
      </section>

      <h2 id="sheet-title">Ledger Sheet</h2>

      <div class="sheet-thead-wrap" id="sheet-thead-wrap">
        <table class="sheet wide">
          <thead>
            <tr><th>S.No.</th><th>பெயர்</th><th>Name</th><th>Mobile Number</th><th>சந்தா</th><th>அசல்</th><th>வட்டி</th><th>தொகை</th><th>மொத்தம்</th><th>குறிப்பு</th></tr>
            <tr class="filter-row">
              <td><input type="text" id="filter-sno" class="filter-input" placeholder="Filter" /></td>
              <td><input type="text" id="filter-name" class="filter-input" placeholder="Filter" /></td>
              <td><input type="text" id="filter-name-en" class="filter-input" placeholder="Filter" /></td>
              <td><input type="text" id="filter-mobile" class="filter-input" placeholder="Filter" /></td>
              <td><input type="text" id="filter-santha" class="filter-input" placeholder="Filter" /></td>
              <td><input type="text" id="filter-asal" class="filter-input" placeholder="Filter" /></td>
              <td><input type="text" id="filter-vatti" class="filter-input" placeholder="Filter" /></td>
              <td><input type="text" id="filter-thogai" class="filter-input" placeholder="Filter" /></td>
              <td><input type="text" id="filter-total" class="filter-input" placeholder="Filter" /></td>
              <td><input type="text" id="filter-paid" class="filter-input" placeholder="Filter" /></td>
            </tr>
          </thead>
        </table>
      </div>
    </div>
  </div>

  <main>

    <section class="card sheet-table-card">
      <div class="table-wrap sheet-tbody-wrap" id="sheet-tbody-wrap">
      <table class="sheet wide">
        <tbody id="sheet-body"></tbody>
        <tfoot>
          <tr id="sheet-new-row">
            <td><input type="number" id="new-member-no" min="1" placeholder="No." disabled /></td>
            <td><input type="text" id="new-name" placeholder="புதிய பெயரை உள்ளிடவும்..." /></td>
            <td><input type="text" id="new-name-en" placeholder="Name" /></td>
            <td><input type="text" id="new-mobile" placeholder="Mobile" inputmode="numeric" pattern="[0-9]*" disabled /></td>
            <td>
              <div class="santha-cell">
                <input type="checkbox" id="new-santha-check" disabled />
                <span class="santha-amount" id="new-santha-amount">0</span>
              </div>
            </td>
            <td><input type="text" id="new-asal" placeholder="0" inputmode="numeric" pattern="[0-9]*" disabled /></td>
            <td><input type="text" id="new-vatti" placeholder="0" inputmode="numeric" pattern="[0-9]*" disabled /></td>
            <td><input type="text" id="new-thogai" placeholder="0" inputmode="numeric" pattern="[0-9]*" disabled /></td>
            <td class="total-cell">0</td>
            <td><input type="text" id="new-paid" placeholder="குறிப்பு" disabled /></td>
          </tr>
          <tr id="new-type-row" class="hidden">
            <td colspan="10">
              <div class="new-type-picker">
                <span>This function allows all people-Types — pick one for the new member:</span>
                <select id="new-type" required>
                  <option value="">Select Type…</option>
                  <option value="24Manai">24Manai</option>
                  <option value="Others">Others</option>
                </select>
              </div>
            </td>
          </tr>
        </tfoot>
      </table>
      </div>
    </section>

  </main>

  <div class="totals-banner" id="totals-banner">
    <a href="members.html" class="header-link-btn">போளியம்மனூர் உறுப்பினர்கள்</a>
    <div class="totals-track" id="totals-track">
      <div class="totals-col" data-col="5"><span class="totals-value" id="totals-santha">0</span></div>
      <div class="totals-col" data-col="6"><span class="totals-value" id="totals-asal">0</span></div>
      <div class="totals-col" data-col="7"><span class="totals-value" id="totals-vatti">0</span></div>
      <div class="totals-col" data-col="8"><span class="totals-value" id="totals-thogai">0</span></div>
      <div class="totals-col" data-col="9"><span class="totals-value totals-grand" id="totals-total">0</span></div>
      <div class="totals-col totals-col-auto" data-col="10"><span class="totals-value totals-grand totals-shine">Grand Total = <span id="totals-grand">0</span></span></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="shared.js?v=20260811a"></script>
<script src="app.js?v=20260811a"></script>
</body>
</html>
