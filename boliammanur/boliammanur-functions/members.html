<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>போளியம்மனூர் உறுப்பினர்கள் — போளியம்மனூர் திருப்பணி சங்கம்</title>
<link rel="stylesheet" href="style.css?v=20260811d" />
</head>
<!--
  HEART LOGIC INDEX — members.html — do not change any of the following
  without asking first (warn "Warning: Heart Logic" and get explicit
  permission before touching any of it). Each of these was arrived at after
  a real, measured problem — reverting to something that "looks simpler"
  reintroduces the original bug. Full reasoning for each lives as a comment
  at its actual code location; this is the index.

  1. .sticky-top-stack (style.css) — header + .members-filter-card +
     .members-thead-wrap share ONE sticky container instead of each being
     independently sticky. Independent sticky + JS-measured offsets caused
     a real two-stage stutter (one piece shrank a frame before its
     neighbor's position updated).
  2. transform:scale() vs padding/font-size for shrink animations
     (header h1, .members-filter-card in style.css) — transform is
     compositor-only (no forced layout recalc every frame); padding/
     font-size transitions do force it, and cost scales with total page
     size. The table's own header/filter row is the ONE exception, left on
     padding/font-size deliberately — switching it to transform breaks
     column alignment with .members-tbody-wrap.
  3. header h1 uses transform:scale(), never font-size (style.css) —
     animating font-size on wrapping text causes a discrete (unsmoothable)
     jump exactly when it collapses from 2 lines to 1.
  4. syncPillsCardCollapse() measures card.offsetHeight directly
     (members.js), not the parent's auto-computed height — a
     negative margin-bottom on a width-constrained element doesn't reduce
     the parent's height correctly (confirmed on the real page, root cause
     never fully isolated).
  5. .members-thead-wrap / .members-tbody-wrap / .members-table-card carry
     their own border/radius/shadow directly, no .card wrapper (style.css)
     — the "no container" spreadsheet look. overflow:hidden on both
     wrappers (not just overflow-x) is what actually rounds the corners,
     since border-radius directly on a <th>/<td> is unreliable under
     border-collapse:collapse.
  6. .sticky-top-inner uses the exact same max-width:1320px/margin:auto/
     padding container <main> uses (style.css) — not similar values, the
     literal same mechanism, so the pills bar/spreadsheet header
     structurally can't drift out of alignment with .members-table-card.
     An earlier version computed width via max-width:min(calc(...),1288px)
     directly on .members-thead-wrap — verified correct in every automated
     check across two browser engines, but intermittently rendered
     flush-left on a real device, fixed by reload.
  7. table.members-table column widths are literal fixed px (style.css,
     already marked HEART LOGIC there) — do not stretch to fill wide
     screens. A percentage-based stretch version was built and tested, then
     explicitly reverted.
  8. table.sheet tbody odd/even row backgrounds are explicit var(--surface)
     / var(--surface-2) (style.css), not left transparent — the table sits
     directly on the page background now (no white card behind it), so
     transparent showed the page's own faint cream tint instead of white.
  9. .pill-row (members filter buttons) is nowrap + overflow-x:auto
     (style.css), never wraps to multiple lines — wrapping split the
     shared rounded outline unevenly. members.js scrolls the clicked pill
     to center on click so neighbors peek on both sides on narrow screens.
  10. style.css / shared.js / members.js are loaded with a ?v=... cache-
      busting query string (this file, and the same three files' equivalents
      in index.html) — browsers repeatedly served a stale cached copy after
      a real deploy until a manual hard refresh, which on index.html once
      surfaced as a much worse symptom than stale styling: a stale app.js
      referencing an element id that had been renamed in a restructure
      silently threw and aborted before the ledger rows ever rendered,
      leaving only the static header row visible with no data — bump the
      version string on every future change to any of these three files, on
      both pages, every time.
  11. Deployment: this file has two homes — the boliammanur-functions repo
      (source) and the eagleview-site repo (mirror, actually served at
      newmantech.in) — every change needs pushing to BOTH, verified by
      fetching the live URL directly afterward, not just trusting the push
      succeeded.
-->
<body>

<div class="sticky-top-stack">
  <header>
    <h1>போளியம்மனூர் உறுப்பினர்கள்</h1>
  </header>

  <div class="sticky-top-inner">
    <section class="card compact members-filter-card">
      <div class="pill-row" id="type-filter-pills">
        <button type="button" class="pill active" data-filter="all" data-label="மொத்த உறுப்பினர்கள்">மொத்த உறுப்பினர்கள்</button>
        <button type="button" class="pill" data-filter="24manai" data-label="24 Manai">24 Manai</button>
        <button type="button" class="pill" data-filter="others" data-label="Others">Others</button>
      </div>
    </section>

    <div class="members-thead-wrap" id="members-thead-wrap">
      <table class="sheet wide members-table">
        <thead>
          <tr><th>S.No</th><th>Roll No.</th><th>பெயர்</th><th>Name</th><th>Mobile Number</th><th>Type</th><th>Avoid</th></tr>
          <tr class="filter-row">
            <td><label for="filter-sno" class="sr-only">Filter by S.No</label><input type="text" id="filter-sno" class="filter-input" placeholder="Filter" inputmode="numeric" pattern="[0-9]*" /></td>
            <td><label for="filter-roll" class="sr-only">Filter by Roll No.</label><input type="text" id="filter-roll" class="filter-input" placeholder="Filter" inputmode="numeric" pattern="[0-9]*" /></td>
            <td><label for="filter-name" class="sr-only">Filter by பெயர்</label><input type="text" id="filter-name" class="filter-input" placeholder="Filter" /></td>
            <td><label for="filter-name-en" class="sr-only">Filter by Name</label><input type="text" id="filter-name-en" class="filter-input" placeholder="Filter" /></td>
            <td><label for="filter-mobile" class="sr-only">Filter by Mobile Number</label><input type="text" id="filter-mobile" class="filter-input" placeholder="Filter" inputmode="numeric" /></td>
            <td>
              <label for="filter-type" class="sr-only">Filter by Type</label>
              <select id="filter-type" class="filter-input">
                <option value="">All</option>
                <option value="24Manai">24Manai</option>
                <option value="Others">Others</option>
              </select>
            </td>
            <td></td>
          </tr>
        </thead>
      </table>
    </div>
  </div>
</div>

<main>
  <section class="card members-table-card">
    <div class="table-wrap members-tbody-wrap" id="members-tbody-wrap">
      <table class="sheet wide members-table">
        <tbody id="members-body"></tbody>
        <tfoot>
          <tr id="new-member-row">
            <td id="new-m-sno" class="new-member-num"></td>
            <td id="new-m-roll" class="new-member-num"></td>
            <td><label for="new-m-name" class="sr-only">New member's பெயர்</label><input type="text" id="new-m-name" placeholder="புதிய பெயரை உள்ளிடவும்..." /></td>
            <td><label for="new-m-name-en" class="sr-only">New member's Name</label><input type="text" id="new-m-name-en" placeholder="Name" /></td>
            <td><label for="new-m-mobile" class="sr-only">New member's Mobile Number</label><input type="text" id="new-m-mobile" placeholder="Mobile" inputmode="numeric" pattern="[0-9]*" disabled /></td>
            <td>
              <label for="new-m-type" class="sr-only">New member's Type</label>
              <select id="new-m-type" disabled required>
                <option value="">Select Type…</option>
                <option value="24Manai">24Manai</option>
                <option value="Others">Others</option>
              </select>
            </td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <p class="status" id="members-status" role="status" aria-live="polite"></p>
  </section>
</main>

<div class="totals-banner totals-banner-simple">
  <a href="index.html" class="header-link-btn">← Back</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="shared.js?v=20260811a"></script>
<script src="members.js?v=20260811a"></script>
</body>
</html>
