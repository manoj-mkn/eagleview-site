<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eagle View — QA Dashboard</title>
<style>
:root{
  --bg:#F0F2F7;--bg2:#FFFFFF;--bg3:#E8EBF2;--border:#D0D4E0;
  --text:#111120;--text2:#60607A;--accent:#E87722;--accent2:#C45E00;
  --pass:#22C55E;--fail:#EF4444;--skip:#6B7280;
  --pass-bg:rgba(34,197,94,0.14);--fail-bg:rgba(239,68,68,0.14);--skip-bg:rgba(107,114,128,0.13);
  --shadow:0 2px 8px rgba(0,0,0,0.10);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0D0D10;--bg2:#16161A;--bg3:#1E1E24;--border:#2A2A35;
  --text:#E8E8F0;--text2:#9898A8;--shadow:0 2px 8px rgba(0,0,0,0.4);
}}
:root[data-theme="dark"]{--bg:#0D0D10;--bg2:#16161A;--bg3:#1E1E24;--border:#2A2A35;--text:#E8E8F0;--text2:#9898A8;--shadow:0 2px 8px rgba(0,0,0,0.4)}
:root[data-theme="light"]{--bg:#F0F2F7;--bg2:#FFFFFF;--bg3:#E8EBF2;--border:#D0D4E0;--text:#111120;--text2:#60607A;--shadow:0 2px 8px rgba(0,0,0,0.10)}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:14px;background:var(--bg);color:var(--text)}
body{min-height:100vh}

/* ── Header ── */
#header{position:sticky;top:0;z-index:100;background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 24px;box-shadow:var(--shadow)}
#header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dash-title{font-size:18px;font-weight:800;color:var(--accent);flex:1;min-width:0}
.dash-meta{font-size:12px;color:var(--text2);white-space:nowrap}
.dash-version{font-size:11px;font-weight:700;color:var(--text2);background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:2px 7px;white-space:nowrap;flex-shrink:0}
.hdr-btn{padding:5px 13px;border:1px solid var(--border);border-radius:6px;background:var(--bg3);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.hdr-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── Main ── */
main{max-width:1200px;margin:0 auto;padding:24px 16px 60px}

/* ── Stat cards ── */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:18px 16px}
.stat-value{font-size:30px;font-weight:900;color:var(--accent);line-height:1}
.stat-label{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.6px;margin-top:7px}

/* ── Section card ── */
.dash-section{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px}
.dash-section-hdr{padding:10px 16px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:11px;font-weight:800;color:var(--text);text-transform:uppercase;letter-spacing:0.6px;display:flex;align-items:center;gap:8px}
.hdr-count{font-size:11px;font-weight:700;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:1px 7px}

/* ── TC bar rows ── */
.tc-row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--border)}
.tc-row:last-child{border-bottom:none}
.tc-row-id{font-size:10px;font-weight:700;color:var(--text2);font-family:'SF Mono',Consolas,monospace;min-width:48px;flex-shrink:0}
.tc-bar-wrap{flex:1;height:14px;border-radius:4px;overflow:hidden;background:var(--bg3);display:flex;gap:1px}
.tc-bar-seg{height:100%;transition:width 0.5s cubic-bezier(0.4,0,0.2,1)}
.tc-bar-pass{background:var(--pass)}
.tc-bar-fail{background:var(--fail)}
.tc-bar-skip{background:var(--skip)}
.tc-counts{display:flex;gap:10px;font-size:11px;font-weight:700;min-width:90px;flex-shrink:0}
.cnt-pass{color:var(--pass)}.cnt-fail{color:var(--fail)}.cnt-skip{color:var(--skip)}

/* ── Notes ── */
.notes-group{border-bottom:1px solid var(--border)}
.notes-group:last-child{border-bottom:none}
.notes-group-hdr{padding:8px 16px;font-size:11px;font-weight:800;color:var(--accent);background:rgba(232,119,34,0.05);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.note-block{padding:10px 16px;border-bottom:1px solid var(--border)}
.note-block:last-child{border-bottom:none}
.note-meta{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px}
.note-text{font-size:12px;color:var(--text);line-height:1.6;padding-left:10px;border-left:2px solid var(--accent);white-space:pre-wrap}

/* ── Submissions table ── */
.tbl-wrap{overflow-x:auto}
.sub-table{width:100%;border-collapse:collapse;min-width:560px}
.sub-table th{padding:8px 12px;text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.4px;color:var(--text2);background:var(--bg3);border-bottom:1px solid var(--border);white-space:nowrap}
.sub-table td{padding:9px 12px;font-size:12px;border-bottom:1px solid var(--border);vertical-align:middle}
.sub-table tr:last-child td{border-bottom:none}
.sub-table tbody tr:hover td{background:rgba(232,119,34,0.04)}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.badge-pass{background:var(--pass-bg);color:var(--pass)}
.badge-fail{background:var(--fail-bg);color:var(--fail)}
.badge-skip{background:var(--skip-bg);color:var(--skip)}
.tester-name{font-weight:700;color:var(--text)}

/* ── Version tabs ── */
#version-tabs{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:none}
.vtab-label{font-size:10px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:10px}
.vtab-row{display:flex;gap:8px;flex-wrap:wrap}
.vtab{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:var(--bg3);color:var(--text2);transition:all 0.15s;user-select:none}
.vtab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.vtab:not(.active):hover{border-color:var(--accent);color:var(--accent)}

/* ── Tester filter panel ── */
#tester-panel{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:20px;display:none}
.tp-label{font-size:10px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.tp-actions{margin-left:auto;display:flex;gap:6px}
.tp-action{font-size:11px;font-weight:700;color:var(--accent);cursor:pointer;background:none;border:none;padding:0;text-decoration:underline}
.tester-chips{display:flex;flex-wrap:wrap;gap:8px}
.tester-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;
  border:1.5px solid var(--border);background:var(--bg3);color:var(--text2);
  transition:all 0.15s;user-select:none;
}
.tester-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tester-chip .chip-count{font-size:10px;opacity:0.8}

/* ── Loading / empty / error ── */
#loading{text-align:center;padding:70px 20px;color:var(--text2);font-size:13px}
.spinner{display:block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-msg{padding:40px;text-align:center;color:var(--text2);font-size:13px}

/* ── PDF timestamp ── */
#pdf-timestamp{display:none;font-size:11px;color:var(--text2);text-align:center;padding:6px 16px;margin:0 0 8px}
@media print{
  #header{display:none!important}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:white!important}
  #pdf-timestamp{display:block!important}
  body.print-main-only #tester-panel{display:none!important}
  body.print-main-only #section-all-submissions{display:none!important}
}

/* ── Print scope modal ── */
#print-scope-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center}
#print-scope-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(2px)}
#print-scope-box{position:relative;z-index:1;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:28px 32px;min-width:300px;box-shadow:0 8px 32px rgba(0,0,0,0.28);display:flex;flex-direction:column;gap:10px}
#print-scope-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:4px}
#print-scope-note{font-size:11px;color:var(--text2);line-height:1.5;margin-top:2px}
.psc-btn{padding:10px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:opacity 0.15s}
#psc-whole{border:1.5px solid var(--accent);background:var(--accent);color:#fff}
#psc-whole:hover{opacity:0.85}
#psc-section{border:1.5px solid var(--border);background:var(--bg3);color:var(--text)}
#psc-section:hover{opacity:0.75}
#psc-cancel{margin-top:2px;padding:6px;background:none;border:none;color:var(--text2);font-size:12px;cursor:pointer;text-decoration:underline;text-align:center}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div id="header">
  <div id="header-inner">
    <div class="dash-title">Eagle View — QA Dashboard</div>
    <span class="dash-version">v1.1.3</span>
    <div class="dash-meta" id="dash-meta">Loading…</div>
    <button class="hdr-btn" onclick="savePDF()">⬇ Save as PDF</button>
    <button class="hdr-btn" onclick="savePDFDirect(this)">⬇ Direct PDF</button>
    <button class="hdr-btn" onclick="toggleTheme()">☀ / ☾</button>
    <button class="hdr-btn" onclick="loadData()">↻ Refresh</button>
  </div>
</div>

<div id="print-scope-modal">
  <div id="print-scope-backdrop"></div>
  <div id="print-scope-box">
    <div id="print-scope-title">What would you like to print?</div>
    <button class="psc-btn" id="psc-whole">Whole Print</button>
    <button class="psc-btn" id="psc-section">Main Section Only</button>
    <div id="print-scope-note">Main section excludes "Filter by Tester" and "All Submissions"</div>
    <button id="psc-cancel">Cancel</button>
  </div>
</div>

<div id="pdf-timestamp"></div>
<main>
  <div id="loading"><span class="spinner"></span>Loading QA data…</div>
  <div id="version-tabs"></div>
  <div id="tester-panel">
    <div class="tp-label">
      Filter by Tester
      <div class="tp-actions">
        <button class="tp-action" onclick="selectAll()">Select All</button>
        <button class="tp-action" onclick="selectNone()">Clear</button>
      </div>
    </div>
    <div class="tester-chips" id="tester-chips"></div>
  </div>
  <div id="dashboard" style="display:none"></div>
</main>

<script>
const _sb = supabase.createClient(
  'https://zjppzsjtacfcgoskeynj.supabase.co',
  'sb_publishable_98NHJeyCD8JtPK0Njhdidw_NAWgJjy4'
);

let allRows = [];
let selectedTesters = new Set();
let currentVersion = null;
let userHidden = true;
let userMap = {};

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('en-GB', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function maskName(name) {
  return userHidden ? (userMap[String(name)] || name) : name;
}
function toggleUserHide() {
  userHidden = !userHidden;
  buildTesterPanel(getVersionRows());
  applyFilter();
}
function toggleTheme() {
  const el = document.documentElement;
  el.setAttribute('data-theme', el.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

function sortTCIds(ids) {
  return ids.sort((a, b) => {
    const na = parseInt(a.replace(/\D/g,'')) || 0;
    const nb = parseInt(b.replace(/\D/g,'')) || 0;
    return na - nb;
  });
}

function getVersionsSorted(rows) {
  const vs = [...new Set(rows.map(r => r.version || 'Unknown'))];
  return vs.sort((a, b) => {
    const pa = (a.match(/\d+/g) || []).map(Number);
    const pb = (b.match(/\d+/g) || []).map(Number);
    for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
      const diff = (pb[i] || 0) - (pa[i] || 0);
      if (diff !== 0) return diff;
    }
    return 0;
  });
}

function getVersionRows() {
  return currentVersion ? allRows.filter(r => r.version === currentVersion) : allRows;
}

function buildVersionTabs(rows) {
  const versions = getVersionsSorted(rows);
  const wrap = document.getElementById('version-tabs');
  if (versions.length <= 1) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  const tabs = versions.map(v =>
    `<button class="vtab" data-v="${esc(v)}" onclick="setVersion('${esc(v)}')">${esc(v)}</button>`
  ).join('');
  wrap.innerHTML = `<div class="vtab-label">Version</div><div class="vtab-row">${tabs}<button class="vtab" data-v="__all__" onclick="setVersion(null)">All</button></div>`;
}

function updateVersionTabActive() {
  document.querySelectorAll('.vtab').forEach(t => {
    t.classList.toggle('active', currentVersion ? t.dataset.v === currentVersion : t.dataset.v === '__all__');
  });
  document.querySelector('.dash-version').textContent = currentVersion || 'All versions';
}

function setVersion(v) {
  currentVersion = v;
  updateVersionTabActive();
  selectedTesters = new Set();
  buildTesterPanel(getVersionRows());
  applyFilter();
}

function buildTesterPanel(rows) {
  const counts = {};
  rows.forEach(r => {
    const name = r.tester || 'Unknown';
    counts[name] = (counts[name] || 0) + 1;
  });
  const testers = Object.keys(counts).sort();
  testers.forEach(t => selectedTesters.add(t));
  const wrap = document.getElementById('tester-chips');
  wrap.innerHTML = testers.map(t => `
    <div class="tester-chip active" data-tester="${esc(t)}" onclick="toggleTester(this,'${esc(t)}')">
      ${esc(maskName(t))} <span class="chip-count">${counts[t]}</span>
    </div>`).join('');
  document.getElementById('tester-panel').style.display = testers.length > 0 ? 'block' : 'none';
}

function toggleTester(chip, name) {
  if (selectedTesters.has(name)) { selectedTesters.delete(name); chip.classList.remove('active'); }
  else { selectedTesters.add(name); chip.classList.add('active'); }
  applyFilter();
}
function selectAll() {
  getVersionRows().forEach(r => selectedTesters.add(r.tester || 'Unknown'));
  document.querySelectorAll('.tester-chip').forEach(c => c.classList.add('active'));
  applyFilter();
}
function selectNone() {
  selectedTesters.clear();
  document.querySelectorAll('.tester-chip').forEach(c => c.classList.remove('active'));
  applyFilter();
}
function applyFilter() {
  const vRows = getVersionRows();
  const filtered = vRows.filter(r => selectedTesters.has(r.tester || 'Unknown'));
  const n = filtered.length;
  const total = vRows.length;
  document.getElementById('dash-meta').textContent =
    n + ' of ' + total + ' submission' + (total !== 1 ? 's' : '') + ' selected';
  if (n === 0) {
    document.getElementById('dashboard').innerHTML = '<div class="empty-msg">No submissions match the current filter.</div>';
    document.getElementById('dashboard').style.display = 'block';
  } else {
    renderDashboard(filtered);
  }
}

async function loadData() {
  document.getElementById('loading').innerHTML = '<span class="spinner"></span>Loading…';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';

  const { data, error } = await _sb
    .from('eagleview_qa')
    .select('*')
    .order('submitted_at', { ascending: false });

  document.getElementById('loading').style.display = 'none';
  if (error) {
    document.getElementById('loading').innerHTML =
      '<div style="color:var(--fail);padding:40px;text-align:center;font-weight:700">Failed to load: ' + esc(error.message) + '</div>';
    document.getElementById('loading').style.display = 'block';
    return;
  }

  allRows = data || [];
  selectedTesters = new Set();

  const testerNames = [...new Set(allRows.map(r => r.tester || 'Unknown'))].sort();
  userMap = {};
  testerNames.forEach((t, i) => { userMap[t] = 'User' + (i + 1); });

  buildVersionTabs(allRows);
  const versions = getVersionsSorted(allRows);
  currentVersion = versions.length > 0 ? versions[0] : null;
  updateVersionTabActive();

  buildTesterPanel(getVersionRows());

  const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  document.getElementById('dash-meta').textContent =
    getVersionRows().length + ' submission' + (getVersionRows().length !== 1 ? 's' : '') + ' · Updated ' + now;

  if (allRows.length === 0) {
    document.getElementById('dashboard').innerHTML =
      '<div class="empty-msg">No submissions yet. Complete the QA checklist to get started.</div>';
    document.getElementById('dashboard').style.display = 'block';
    return;
  }

  applyFilter();
}

function renderDashboard(rows) {
  const n = rows.length;

  /* ── Collect all TC IDs ── */
  const idSet = new Set();
  rows.forEach(r => { if (r.answers) Object.keys(r.answers).forEach(k => idSet.add(k)); });
  const tcIds = sortTCIds([...idSet]);

  /* ── Stat cards ── */
  const platforms = {};
  let totalPass = 0, totalAnswered = 0;
  rows.forEach(r => {
    const p = r.platform || 'Unknown';
    platforms[p] = (platforms[p] || 0) + 1;
    Object.values(r.answers || {}).forEach(v => {
      totalAnswered++;
      if (v === 'pass') totalPass++;
    });
  });
  const passRate   = totalAnswered > 0 ? Math.round(totalPass / totalAnswered * 100) + '%' : '—';
  const topPlat    = Object.entries(platforms).sort((a, b) => b[1] - a[1])[0]?.[0] || '—';
  const platCount  = Object.keys(platforms).length;

  const stats = `<div class="stat-row">
    <div class="stat-card">
      <div class="stat-value">${n}</div>
      <div class="stat-label">Total Submissions</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:var(--pass)">${passRate}</div>
      <div class="stat-label">Overall Pass Rate</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${platCount}</div>
      <div class="stat-label">Platforms Tested</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="font-size:${topPlat.length > 10 ? '13px' : '18px'};padding-top:6px">${esc(topPlat)}</div>
      <div class="stat-label">Top Platform</div>
    </div>
  </div>`;

  /* ── TC bar rows ── */
  let bars = '';
  tcIds.forEach(id => {
    let pass = 0, fail = 0, skip = 0;
    rows.forEach(r => {
      const v = r.answers?.[id];
      if (v === 'pass') pass++;
      else if (v === 'fail') fail++;
      else if (v === 'skip') skip++;
    });
    const tot = (pass + fail + skip) || 1;
    const pw = Math.round(pass/tot*100), fw = Math.round(fail/tot*100), sw = Math.round(skip/tot*100);
    bars += `<div class="tc-row">
      <div class="tc-row-id">${esc(id)}</div>
      <div class="tc-bar-wrap">
        <div class="tc-bar-seg tc-bar-pass" style="width:${pw}%"></div>
        <div class="tc-bar-seg tc-bar-skip" style="width:${sw}%"></div>
        <div class="tc-bar-seg tc-bar-fail" style="width:${fw}%"></div>
      </div>
      <div class="tc-counts">
        <span class="cnt-pass">✓ ${pass}</span>
        <span class="cnt-skip">– ${skip}</span>
        <span class="cnt-fail">✗ ${fail}</span>
      </div>
    </div>`;
  });

  /* ── Notes ── */
  const notesByTC = {};
  rows.forEach(r => {
    Object.entries(r.notes || {}).forEach(([id, txt]) => {
      if (!txt?.trim()) return;
      if (!notesByTC[id]) notesByTC[id] = [];
      notesByTC[id].push({ tester: r.tester, platform: r.platform, submitted_at: r.submitted_at, text: txt });
    });
  });
  const noteIds = sortTCIds(Object.keys(notesByTC));
  let noteSections = '';
  if (noteIds.length === 0) {
    noteSections = '<div style="padding:12px 16px;font-size:12px;color:var(--text2)">No notes recorded yet.</div>';
  } else {
    noteIds.forEach(id => {
      const entries = notesByTC[id];
      const items = entries.map(e => `<div class="note-block">
        <div class="note-meta">${esc(maskName(e.tester||'Unknown'))} · ${esc(e.platform||'—')} · ${fmtDate(e.submitted_at)}</div>
        <div class="note-text">${esc(e.text)}</div>
      </div>`).join('');
      noteSections += `<div class="notes-group">
        <div class="notes-group-hdr">${esc(id)} <span class="hdr-count">${entries.length}</span></div>
        ${items}
      </div>`;
    });
  }

  /* ── All submissions table ── */
  let trows = '';
  rows.forEach(r => {
    let pass = 0, fail = 0, skip = 0;
    Object.values(r.answers || {}).forEach(v => {
      if (v === 'pass') pass++;
      else if (v === 'fail') fail++;
      else if (v === 'skip') skip++;
    });
    trows += `<tr>
      <td><span class="tester-name">${esc(maskName(r.tester||'—'))}</span></td>
      <td>${esc(r.platform||'—')}</td>
      <td>${esc(r.display||'—')}</td>
      <td>${esc(r.version||'—')}</td>
      <td style="color:var(--text2)">${fmtDate(r.submitted_at)}</td>
      <td><span class="badge badge-pass">✓ ${pass}</span></td>
      <td><span class="badge badge-skip">– ${skip}</span></td>
      <td><span class="badge badge-fail">✗ ${fail}</span></td>
    </tr>`;
  });

  document.getElementById('dashboard').innerHTML = stats + `
    <div class="dash-section">
      <div class="dash-section-hdr">TC Results <span class="hdr-count">${n} submission${n!==1?'s':''}</span></div>
      ${bars}
    </div>
    <div class="dash-section">
      <div class="dash-section-hdr">Notes</div>
      ${noteSections}
    </div>
    <div class="dash-section" id="section-all-submissions">
      <div class="dash-section-hdr">All Submissions <span class="hdr-count">${n}</span></div>
      <div class="tbl-wrap">
        <table class="sub-table">
          <thead><tr>
            <th>Tester</th><th>Platform</th><th>Display</th><th>Version</th><th>Submitted</th>
            <th>Pass</th><th>N/A</th><th>Fail</th>
          </tr></thead>
          <tbody>${trows}</tbody>
        </table>
      </div>
    </div>`;
  document.getElementById('dashboard').style.display = 'block';
}

/* ── PDF ── */
function pdfTimestampText() {
  const when = new Date().toLocaleString('en-GB', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  return `Generated: ${when}`;
}
function showPrintDialog() {
  return new Promise(resolve => {
    const modal = document.getElementById('print-scope-modal');
    modal.style.display = 'flex';
    function done(val) { modal.style.display = 'none'; resolve(val); }
    document.getElementById('psc-whole').onclick = () => done('whole');
    document.getElementById('psc-section').onclick = () => done('section');
    document.getElementById('psc-cancel').onclick = () => done(null);
    document.getElementById('print-scope-backdrop').onclick = () => done(null);
  });
}
async function savePDF() {
  const scope = await showPrintDialog();
  if (!scope) return;
  const ts = document.getElementById('pdf-timestamp');
  if (ts) ts.textContent = pdfTimestampText();
  const prev = document.title;
  document.title = `EagleView_QA_Dashboard_${new Date().toISOString().slice(0,10)}`;
  if (scope === 'section') document.body.classList.add('print-main-only');
  window.print();
  if (scope === 'section') document.body.classList.remove('print-main-only');
  document.title = prev;
  if (ts) ts.textContent = '';
}
async function savePDFDirect(btn) {
  const scope = await showPrintDialog();
  if (!scope) return;
  if (!window.html2canvas || !window.jspdf) { alert('PDF library not loaded.'); return; }
  const orig = btn.textContent;
  btn.textContent = '⏳ Generating…'; btn.disabled = true;
  try {
    const prevScrollY = window.scrollY;
    const tsEl = document.getElementById('pdf-timestamp');
    const overrideStyle = document.createElement('style');
    overrideStyle.id = 'pdf-cap-override';
    let hideCSS = '#header{display:none!important}';
    if (scope === 'section') hideCSS += '#tester-panel{display:none!important}#section-all-submissions{display:none!important}';
    overrideStyle.textContent = hideCSS;
    let canvas;
    try {
      if (tsEl) { tsEl.textContent = pdfTimestampText(); tsEl.style.display = 'block'; }
      window.scrollTo(0, 0);
      document.head.appendChild(overrideStyle);
      await new Promise(r => setTimeout(r, 200));
      canvas = await html2canvas(document.body, {
        scale: 2, useCORS: true, allowTaint: false, logging: false,
        scrollX: 0, scrollY: 0,
        windowWidth: document.body.offsetWidth,
        windowHeight: document.body.scrollHeight
      });
    } finally {
      if (tsEl) { tsEl.textContent = ''; tsEl.style.display = ''; }
      window.scrollTo(0, prevScrollY);
      overrideStyle.remove();
    }
    if (!canvas) return;
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pW = pdf.internal.pageSize.getWidth();
    const pH = pdf.internal.pageSize.getHeight();
    const img = canvas.toDataURL('image/jpeg', 0.95);
    const iH = canvas.height * pW / canvas.width;
    let y = 0;
    pdf.addImage(img, 'JPEG', 0, y, pW, iH);
    let rem = iH - pH;
    while (rem > 0) { y -= pH; pdf.addPage(); pdf.addImage(img, 'JPEG', 0, y, pW, iH); rem -= pH; }
    pdf.save(`EagleView_QA_Dashboard_${new Date().toISOString().slice(0,10)}.pdf`);
  } catch(e) {
    alert('PDF failed: ' + e.message);
  } finally {
    btn.textContent = orig; btn.disabled = false;
  }
}

document.getElementById('header').addEventListener('dblclick', function(e) {
  if (e.target.closest('button')) return;
  toggleUserHide();
});

loadData();
</script>
