<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eagle View — Test Case Dashboard</title>
<style>
:root{
  --bg:#F0F2F7;--bg2:#FFFFFF;--bg3:#E8EBF2;--border:#D0D4E0;
  --text:#111120;--text2:#60607A;--accent:#E87722;--accent2:#C45E00;
  --pass:#22C55E;--fail:#EF4444;--skip:#6B7280;
  --pass-bg:rgba(34,197,94,0.14);--fail-bg:rgba(239,68,68,0.14);--skip-bg:rgba(107,114,128,0.13);
  --shadow:0 2px 8px rgba(0,0,0,0.10);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0D0D10;--bg2:#16161A;--bg3:#1E1E24;--border:#2A2A35;
  --text:#E8E8F0;--text2:#9898A8;--shadow:0 2px 8px rgba(0,0,0,0.4);
}}
:root[data-theme="dark"]{--bg:#0D0D10;--bg2:#16161A;--bg3:#1E1E24;--border:#2A2A35;--text:#E8E8F0;--text2:#9898A8;--shadow:0 2px 8px rgba(0,0,0,0.4)}
:root[data-theme="light"]{--bg:#F0F2F7;--bg2:#FFFFFF;--bg3:#E8EBF2;--border:#D0D4E0;--text:#111120;--text2:#60607A;--shadow:0 2px 8px rgba(0,0,0,0.10)}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:14px;background:var(--bg);color:var(--text)}
body{min-height:100vh}

/* ── Header ── */
#header{position:sticky;top:0;z-index:100;background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 24px;box-shadow:var(--shadow)}
#header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dash-title{font-size:18px;font-weight:800;color:var(--accent);flex:1;min-width:0}
.dash-meta{font-size:12px;color:var(--text2);white-space:nowrap}
.dash-version{font-size:11px;font-weight:700;color:var(--text2);background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:2px 7px;white-space:nowrap;flex-shrink:0}
.hdr-btn{padding:5px 13px;border:1px solid var(--border);border-radius:6px;background:var(--bg3);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.hdr-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.nav-divider{width:1px;height:20px;background:var(--border);flex-shrink:0;align-self:center}

/* ── Main ── */
main{max-width:1200px;margin:0 auto;padding:24px 16px 60px}

/* ── Stat bar (sticky below header) ── */
#stat-bar{position:sticky;z-index:99;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 16px;display:none}
#stat-bar-inner{max-width:1200px;margin:0 auto}

/* ── Stat cards ── */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:0}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 16px}
.stat-value{font-size:30px;font-weight:900;color:var(--accent);line-height:1}
.stat-label{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.6px;margin-top:7px}
.stat-card-pie{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.pie-donut{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pie-donut-center{width:40px;height:40px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:var(--pass)}

/* ── Section card ── */
.dash-section{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px}
.dash-section-hdr{padding:10px 16px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:11px;font-weight:800;color:var(--text);text-transform:uppercase;letter-spacing:0.6px;display:flex;align-items:center;gap:8px}
.hdr-count{font-size:11px;font-weight:700;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:1px 7px}

/* ── TC bar rows ── */
.tc-row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tc-row:last-child{border-bottom:none}
.tc-row-id{font-size:10px;font-weight:700;color:var(--text2);font-family:'SF Mono',Consolas,monospace;min-width:48px;flex-shrink:0}
.tc-bar-wrap{flex:1;height:14px;border-radius:4px;overflow:hidden;background:var(--bg3);display:flex;gap:1px}
.tc-bar-seg{height:100%;transition:width 0.5s cubic-bezier(0.4,0,0.2,1)}
.tc-bar-pass{background:var(--pass)}
.tc-bar-fail{background:var(--fail)}
.tc-bar-skip{background:var(--skip)}
.tc-counts{display:flex;gap:10px;font-size:11px;font-weight:700;min-width:90px;flex-shrink:0}
.cnt-pass{color:var(--pass)}.cnt-fail{color:var(--fail)}.cnt-skip{color:var(--skip)}
.tc-question{display:none;width:100%;font-size:11px;color:var(--text2);line-height:1.5;padding:3px 0 4px 58px;font-style:italic}
.questions-on .tc-question{display:block}
.show-q-btn{margin-left:auto;padding:3px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text2);font-size:10px;font-weight:700;cursor:pointer;transition:all 0.15s;white-space:nowrap;letter-spacing:0.02em}
.hdr-btn-group{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.hdr-btn-group .show-q-btn{margin-left:0}
.row-notes-btn{min-width:72px;text-align:center}
.row-notes-btn:disabled{opacity:0.32;cursor:not-allowed;pointer-events:none}
.show-q-btn:hover{border-color:var(--accent);color:var(--accent)}
.show-q-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tc-row.row-q-on .tc-question{display:block}
.tc-notes{display:none;width:100%;padding:4px 0 6px 58px}
.tc-row.row-notes-on .tc-notes{display:block}
.notes-on .tc-notes{display:block}
.tc-note-item{font-size:11px;border-left:2px solid var(--accent);padding-left:8px;margin-bottom:5px}
.tc-note-item:last-child{margin-bottom:0}
.tc-note-meta{font-size:10px;font-weight:700;color:var(--text2);margin-bottom:2px}
.tc-note-text{font-size:11px;color:var(--text);line-height:1.5;white-space:pre-wrap}

/* ── Dev-response checkboxes (local to this browser only — see toggleAck()) ── */
.tc-ack-check{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--text2);margin-top:5px;cursor:pointer;user-select:none}
.tc-ack-check input{accent-color:var(--accent);cursor:pointer;width:13px;height:13px;flex-shrink:0}
.tc-ack-check.checked{color:var(--pass)}
.tc-status-checks{display:flex;gap:14px;flex-wrap:wrap;width:100%;padding:6px 0 2px 58px;font-size:10px}
.tc-status-check{display:flex;align-items:center;gap:5px;font-weight:700;color:var(--text2);cursor:pointer;user-select:none}
.tc-status-check input{accent-color:var(--accent);cursor:pointer;width:13px;height:13px;flex-shrink:0}
.tc-status-check.checked{color:var(--pass)}

/* ── Notes ── */
.notes-group{border:1px solid var(--border);border-radius:8px;margin:10px 12px;overflow:hidden}
.notes-group:last-child{margin-bottom:12px}
.notes-group-hdr{padding:8px 16px 4px;font-size:11px;font-weight:800;color:var(--accent);background:rgba(232,119,34,0.05);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:3px}
.notes-group-hdr-top{display:flex;align-items:center;gap:8px}
.notes-group-q{font-size:11px;font-weight:400;color:var(--text2);padding-bottom:4px;line-height:1.4}
.note-block{padding:10px 16px;border-bottom:1px solid var(--border)}
.note-block:last-child{border-bottom:none}
.note-block-tested{background:rgba(0,0,0,0.02)}
.note-meta{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px}
.note-text{font-size:12px;color:var(--text);line-height:1.6;padding-left:10px;border-left:2px solid var(--accent);white-space:pre-wrap}

/* ── Submissions table ── */
.tbl-wrap{overflow-x:auto}
.sub-table{width:100%;border-collapse:collapse;min-width:560px}
.sub-table th{padding:8px 12px;text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.4px;color:var(--text2);background:var(--bg3);border-bottom:1px solid var(--border);white-space:nowrap}
.sub-table td{padding:9px 12px;font-size:12px;border-bottom:1px solid var(--border);vertical-align:middle}
.sub-table tr:last-child td{border-bottom:none}
.sub-table tbody tr:hover td{background:rgba(232,119,34,0.04)}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.badge-pass{background:var(--pass-bg);color:var(--pass)}
.badge-fail{background:var(--fail-bg);color:var(--fail)}
.badge-skip{background:var(--skip-bg);color:var(--skip)}
.tester-name{font-weight:700;color:var(--text)}

/* ── Version tabs ── */
#version-tabs{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:none}
.vtab-label{font-size:10px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:10px}
.vtab-row{display:flex;gap:8px;flex-wrap:wrap}
.vtab{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:var(--bg3);color:var(--text2);transition:all 0.15s;user-select:none}
.vtab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.vtab:not(.active):hover{border-color:var(--accent);color:var(--accent)}

/* ── Tester filter panel ── */
#tester-panel{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:20px;display:none}
.tp-label{font-size:10px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.tp-actions{margin-left:auto;display:flex;gap:6px}
.tp-action{font-size:11px;font-weight:700;color:var(--accent);cursor:pointer;background:none;border:none;padding:0;text-decoration:underline}
.tester-chips{display:flex;flex-wrap:wrap;gap:8px}
.tester-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;
  border:1.5px solid var(--border);background:var(--bg3);color:var(--text2);
  transition:all 0.15s;user-select:none;
}
.tester-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tester-chip .chip-count{font-size:10px;opacity:0.8}

/* ── Loading / empty / error ── */
#loading{text-align:center;padding:70px 20px;color:var(--text2);font-size:13px}
.spinner{display:block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-msg{padding:40px;text-align:center;color:var(--text2);font-size:13px}

/* ── PDF timestamp ── */
#pdf-timestamp{display:none;font-size:11px;color:var(--text2);text-align:center;padding:6px 16px;margin:0 0 8px}
@media print{
  #header{display:none!important}
  #stat-bar{position:static!important;border:none!important;box-shadow:none!important}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:white!important}
  #pdf-timestamp{display:block!important}
  body.print-main-only #tester-panel{display:none!important}
  body.print-main-only #section-all-submissions{display:none!important}
}

/* ── Print scope modal ── */
#print-scope-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center}
#print-scope-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(2px)}
#print-scope-box{position:relative;z-index:1;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:28px 32px;min-width:300px;box-shadow:0 8px 32px rgba(0,0,0,0.28);display:flex;flex-direction:column;gap:10px}
#print-scope-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:4px}
#print-scope-note{font-size:11px;color:var(--text2);line-height:1.5;margin-top:2px}
.psc-btn{padding:10px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:opacity 0.15s}
#psc-whole{border:1.5px solid var(--accent);background:var(--accent);color:#fff}
#psc-whole:hover{opacity:0.85}
#psc-section{border:1.5px solid var(--border);background:var(--bg3);color:var(--text)}
#psc-section:hover{opacity:0.75}
#psc-cancel{margin-top:2px;padding:6px;background:none;border:none;color:var(--text2);font-size:12px;cursor:pointer;text-decoration:underline;text-align:center}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div id="header">
  <div id="header-inner">
    <div class="dash-title">Eagle View — Test Case Dashboard</div>
    <span class="dash-version">v1.1.5</span>
    <div class="dash-meta" id="dash-meta">Loading…</div>
    <button class="hdr-btn nav-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ Top</button>
    <button class="hdr-btn nav-btn" onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">↓ Bottom</button>
    <button class="hdr-btn nav-btn" onclick="document.getElementById('section-remarks')?.scrollIntoView({behavior:'smooth',block:'start'})">📌 Remarks</button>
    <span class="nav-divider"></span>
    <button class="hdr-btn" onclick="savePDF()">⬇ Save as PDF</button>
    <button class="hdr-btn" onclick="savePDFDirect(this)">⬇ Direct PDF</button>
    <button class="hdr-btn" onclick="toggleTheme()">☀ / ☾</button>
    <button class="hdr-btn" onclick="loadData()">↻ Refresh</button>
  </div>
</div>

<div id="print-scope-modal">
  <div id="print-scope-backdrop"></div>
  <div id="print-scope-box">
    <div id="print-scope-title">What would you like to print?</div>
    <button class="psc-btn" id="psc-whole">Whole Print</button>
    <button class="psc-btn" id="psc-section">Main Section Only</button>
    <div id="print-scope-note">Main section excludes "Filter by Tester" and "All Submissions"</div>
    <button id="psc-cancel">Cancel</button>
  </div>
</div>

<div id="pdf-timestamp"></div>
<div id="stat-bar"><div id="stat-bar-inner"></div></div>
<main>
  <div id="loading"><span class="spinner"></span>Loading QA data…</div>
  <div id="version-tabs"></div>
  <div id="tester-panel">
    <div class="tp-label">
      Filter by Tester
      <div class="tp-actions">
        <button class="tp-action" onclick="selectAll()">Select All</button>
        <button class="tp-action" onclick="selectNone()">Clear</button>
      </div>
    </div>
    <div class="tester-chips" id="tester-chips"></div>
  </div>
  <div id="dashboard" style="display:none"></div>
</main>

<script>
const _sb = supabase.createClient(
  'https://zjppzsjtacfcgoskeynj.supabase.co',
  'sb_publishable_98NHJeyCD8JtPK0Njhdidw_NAWgJjy4'
);

const CURRENT_VERSION = 'v1.1.5';

let allRows = [];
let selectedTesters = new Set();
let currentVersion = CURRENT_VERSION;
let userHidden = true;
let userMap = {};
// Keyed by version string, e.g. tcQuestionsByVersion['v1.1.4']['TC-085']. Old versions load
// from their frozen eagleview/testcase/archive/{version}.html snapshot instead of the live
// page, so a TC deleted from a later version doesn't blank out its label on older results —
// see questionsUrlFor() / loadQuestions() below.
let tcQuestionsByVersion = {};
let questionsLoadedFor = {};
let questionsShown = false;
let notesShown = false;
let devStatus = {}; // keyed by `${tc_id}__${note_key}` -> { corrected, tested_ok }, from eagleview_qa_dev_status

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('en-GB', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function maskName(name) {
  return userHidden ? (userMap[String(name)] || name) : name;
}
function toggleUserHide() {
  userHidden = !userHidden;
  buildTesterPanel(getVersionRows());
  applyFilter();
}
function toggleTheme() {
  const el = document.documentElement;
  el.setAttribute('data-theme', el.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

function sortTCIds(ids) {
  return ids.sort((a, b) => {
    const na = parseInt(a.replace(/\D/g,'')) || 0;
    const nb = parseInt(b.replace(/\D/g,'')) || 0;
    return na - nb;
  });
}

function getVersionsSorted(rows) {
  const vs = [...new Set(rows.map(r => r.version || 'Unknown'))];
  return vs.sort((a, b) => {
    const pa = (a.match(/\d+/g) || []).map(Number);
    const pb = (b.match(/\d+/g) || []).map(Number);
    for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
      const diff = (pb[i] || 0) - (pa[i] || 0);
      if (diff !== 0) return diff;
    }
    return 0;
  });
}

function getVersionRows() {
  return currentVersion ? allRows.filter(r => r.version === currentVersion) : allRows;
}

function buildVersionTabs(rows) {
  const versions = getVersionsSorted(rows);
  if (!versions.includes(CURRENT_VERSION)) versions.unshift(CURRENT_VERSION);
  const wrap = document.getElementById('version-tabs');
  wrap.style.display = 'block';
  const tabs = versions.map(v =>
    `<button class="vtab" data-v="${esc(v)}" onclick="setVersion('${esc(v)}')">${esc(v)}</button>`
  ).join('');
  wrap.innerHTML = `<div class="vtab-label">Version</div><div class="vtab-row">${tabs}<button class="vtab" data-v="__all__" onclick="setVersion(null)">All</button></div>`;
}

function updateVersionTabActive() {
  document.querySelectorAll('.vtab').forEach(t => {
    t.classList.toggle('active', currentVersion ? t.dataset.v === currentVersion : t.dataset.v === '__all__');
  });
  document.querySelector('.dash-version').textContent = currentVersion || 'All versions';
}

async function setVersion(v) {
  currentVersion = v;
  updateVersionTabActive();
  selectedTesters = new Set();
  buildTesterPanel(getVersionRows());
  applyFilter();

  // Questions panel was already open when the version tab changed — the bars just
  // rendered above with blank question text if this version's map isn't cached yet.
  // Load it now and backfill the same way toggleQuestions() does.
  if (questionsShown) {
    const vkey = questionsVersionKey();
    if (!questionsLoadedFor[vkey]) await loadQuestions(vkey);
    const qMap = tcQuestionsByVersion[vkey] || {};
    document.querySelectorAll('.tc-question[data-id]').forEach(el => {
      el.textContent = qMap[el.dataset.id] || '—';
    });
  }
}

function buildTesterPanel(rows) {
  const counts = {};
  rows.forEach(r => {
    const name = r.tester || 'Unknown';
    counts[name] = (counts[name] || 0) + 1;
  });
  const testers = Object.keys(counts).sort();
  testers.forEach(t => selectedTesters.add(t));
  const wrap = document.getElementById('tester-chips');
  wrap.innerHTML = testers.map(t => `
    <div class="tester-chip active" data-tester="${esc(t)}" onclick="toggleTester(this,'${esc(t)}')">
      ${esc(maskName(t))} <span class="chip-count">${counts[t]}</span>
    </div>`).join('');
  document.getElementById('tester-panel').style.display = testers.length > 0 ? 'block' : 'none';
}

function toggleTester(chip, name) {
  if (selectedTesters.has(name)) { selectedTesters.delete(name); chip.classList.remove('active'); }
  else { selectedTesters.add(name); chip.classList.add('active'); }
  applyFilter();
}
function selectAll() {
  getVersionRows().forEach(r => selectedTesters.add(r.tester || 'Unknown'));
  document.querySelectorAll('.tester-chip').forEach(c => c.classList.add('active'));
  applyFilter();
}
function selectNone() {
  selectedTesters.clear();
  document.querySelectorAll('.tester-chip').forEach(c => c.classList.remove('active'));
  applyFilter();
}
async function applyFilter() {
  const vRows = getVersionRows();
  if (vRows.length === 0) {
    document.getElementById('stat-bar').style.display = 'none';
    document.getElementById('dash-meta').textContent = '0 submissions';
    document.getElementById('dashboard').innerHTML =
      '<div class="empty-msg">No submissions yet for ' + esc(currentVersion || 'this version') + '.<br>Complete the test cases to get started.</div>';
    document.getElementById('dashboard').style.display = 'block';
    return;
  }
  const filtered = vRows.filter(r => selectedTesters.has(r.tester || 'Unknown'));
  const n = filtered.length;
  const total = vRows.length;
  document.getElementById('dash-meta').textContent =
    n + ' of ' + total + ' submission' + (total !== 1 ? 's' : '') + ' selected';
  if (n === 0) {
    document.getElementById('stat-bar').style.display = 'none';
    document.getElementById('dashboard').innerHTML = '<div class="empty-msg">No submissions match the current filter.</div>';
    document.getElementById('dashboard').style.display = 'block';
  } else {
    // Pre-load questions so Remarks section always shows TC descriptions
    const vkey = questionsVersionKey();
    if (!questionsLoadedFor[vkey]) await loadQuestions(vkey);
    renderDashboard(filtered);
  }
}

async function loadDevStatus() {
  const { data, error } = await _sb.from('eagleview_qa_dev_status').select('*');
  if (error) {
    console.error('[dev-status] failed to load:', error.message);
    devStatus = {};
    return;
  }
  devStatus = {};
  (data || []).forEach(row => {
    devStatus[row.tc_id + '__' + (row.note_key || '')] = { corrected: !!row.corrected, tested_ok: !!row.tested_ok };
  });
}

async function loadData() {
  document.getElementById('loading').innerHTML = '<span class="spinner"></span>Loading…';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';

  const [{ data, error }] = await Promise.all([
    _sb.from('eagleview_qa').select('*').order('submitted_at', { ascending: false }),
    loadDevStatus()
  ]);

  document.getElementById('loading').style.display = 'none';
  if (error) {
    document.getElementById('loading').innerHTML =
      '<div style="color:var(--fail);padding:40px;text-align:center;font-weight:700">Failed to load: ' + esc(error.message) + '</div>';
    document.getElementById('loading').style.display = 'block';
    return;
  }

  allRows = data || [];
  selectedTesters = new Set();

  const testerNames = [...new Set(allRows.map(r => r.tester || 'Unknown'))].sort();
  userMap = {};
  testerNames.forEach((t, i) => { userMap[t] = 'User' + (i + 1); });

  buildVersionTabs(allRows);
  currentVersion = CURRENT_VERSION;
  updateVersionTabActive();

  buildTesterPanel(getVersionRows());

  const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  document.getElementById('dash-meta').textContent =
    getVersionRows().length + ' submission' + (getVersionRows().length !== 1 ? 's' : '') + ' · Updated ' + now;

  if (allRows.length === 0) {
    document.getElementById('dashboard').innerHTML =
      '<div class="empty-msg">No submissions yet. Complete the test cases to get started.</div>';
    document.getElementById('dashboard').style.display = 'block';
    return;
  }

  applyFilter();
}

// The version whose question text should back the current view. "All" (currentVersion
// === null) mixes rows from every version, so there's no single correct source — falls
// back to CURRENT_VERSION's text, same as the page always showed before per-version
// archives existed.
function questionsVersionKey() {
  return currentVersion || CURRENT_VERSION;
}

function questionsUrlFor(version) {
  return version === CURRENT_VERSION
    ? 'https://newmantech.in/eagleview/testcase/'
    : `https://newmantech.in/eagleview/testcase/archive/${version}.html`;
}

async function loadQuestions(version) {
  if (questionsLoadedFor[version]) return;
  let html;
  try {
    html = await fetch(questionsUrlFor(version)).then(r => {
      if (!r.ok) throw new Error('no archive for ' + version);
      return r.text();
    });
  } catch (e) {
    // No archive exists for this version (e.g. it predates the archive-on-replace
    // process) — fall back to the live page rather than showing nothing at all.
    html = await fetch('https://newmantech.in/eagleview/testcase/').then(r => r.text());
  }
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const map = {};
  doc.querySelectorAll('.tc[data-id]').forEach(tc => {
    const id = tc.dataset.id;
    const descEl = tc.querySelector('.tc-desc');
    if (!descEl) return;
    descEl.querySelectorAll('.note,.tc-btns').forEach(n => n.remove());
    map[id] = descEl.textContent.replace(/\s+/g, ' ').trim();
  });
  tcQuestionsByVersion[version] = map;
  questionsLoadedFor[version] = true;
}

async function toggleQuestions() {
  const btn = document.getElementById('show-q-btn');
  const section = document.getElementById('tc-results-section');
  if (!btn || !section) return;

  const vkey = questionsVersionKey();
  if (!questionsLoadedFor[vkey]) {
    btn.textContent = 'Loading…';
    btn.disabled = true;
    try {
      await loadQuestions(vkey);
    } catch(e) {
      btn.textContent = 'Show Questions';
      btn.disabled = false;
      return;
    }
  }

  // Always re-populate, not just on the fetch that first set questionsLoadedFor[vkey] —
  // otherwise rows whose text was never written (e.g. a per-row Q click already flipped
  // the flag without touching every row) stay permanently blank once toggled visible.
  const qMap = tcQuestionsByVersion[vkey] || {};
  document.querySelectorAll('.tc-question[data-id]').forEach(el => {
    el.textContent = qMap[el.dataset.id] || '—';
  });

  questionsShown = !questionsShown;
  section.classList.toggle('questions-on', questionsShown);
  btn.textContent = questionsShown ? 'Hide Questions' : 'Show Questions';
  btn.classList.toggle('active', questionsShown);
  btn.disabled = false;
}

async function toggleRowQuestion(btn) {
  const row = btn.closest('.tc-row');
  if (!row) return;

  const vkey = questionsVersionKey();
  if (!questionsLoadedFor[vkey]) {
    btn.textContent = '…';
    btn.disabled = true;
    try {
      await loadQuestions(vkey);
    } catch(e) {
      btn.textContent = 'Q';
      btn.disabled = false;
      return;
    }
  }

  // Always re-populate this row's text, even when some other row's click already flipped
  // questionsLoadedFor[vkey] to true — that flag only tracks whether the fetch happened,
  // not whether THIS row's DOM element got its text written.
  const qEl = row.querySelector('.tc-question[data-id]');
  if (qEl) qEl.textContent = (tcQuestionsByVersion[vkey] || {})[qEl.dataset.id] || '—';

  const isOn = row.classList.toggle('row-q-on');
  btn.classList.toggle('active', isOn);
  btn.textContent = isOn ? 'Hide' : 'Q';
  btn.disabled = false;
}

function toggleAllNotes() {
  const btn = document.getElementById('show-notes-btn');
  const section = document.getElementById('tc-results-section');
  if (!btn || !section) return;
  notesShown = !notesShown;
  section.classList.toggle('notes-on', notesShown);
  btn.textContent = notesShown ? 'Hide Remarks' : 'Show Remarks';
  btn.classList.toggle('active', notesShown);
}

function toggleRowNotes(btn) {
  const row = btn.closest('.tc-row');
  if (!row) return;
  const isOn = row.classList.toggle('row-notes-on');
  btn.classList.toggle('active', isOn);
  btn.textContent = isOn ? 'Hide Remark' : `Remark (${btn.dataset.count})`;
}

// Dev-response checkboxes ("I've corrected this in the app" / "Tested and working
// well") — saved to eagleview_qa_dev_status (same public-anon-key trust model as
// eagleview_qa submissions, this page has no login either way). Synced across
// devices/browsers, unlike the earlier localStorage-only version.
async function toggleAck(cb) {
  const tcId = cb.dataset.tc;
  const noteKey = cb.dataset.note || '';
  const field = cb.dataset.field; // 'corrected' or 'tested_ok'
  if (!tcId || !field) return;
  const checked = cb.checked;
  const label = cb.closest('label');

  cb.disabled = true;
  const payload = { tc_id: tcId, note_key: noteKey, updated_at: new Date().toISOString() };
  payload[field] = checked;
  const { error } = await _sb
    .from('eagleview_qa_dev_status')
    .upsert(payload, { onConflict: 'tc_id,note_key' });
  cb.disabled = false;

  if (error) {
    console.error('[dev-status] failed to save:', error.message);
    cb.checked = !checked; // revert the UI since the save didn't actually happen
    return;
  }
  const devKey = tcId + '__' + noteKey;
  const wasChecked = !!(devStatus[devKey] && devStatus[devKey][field]);
  if (!devStatus[devKey]) devStatus[devKey] = {};
  devStatus[devKey][field] = checked;
  // Mirror state to all matching checkboxes (TC Results + Remarks sections stay in sync)
  document.querySelectorAll(
    `input[type="checkbox"][data-tc="${CSS.escape(tcId)}"][data-note="${CSS.escape(noteKey)}"][data-field="${CSS.escape(field)}"]`
  ).forEach(mirror => {
    mirror.checked = checked;
    const ml = mirror.closest('label');
    if (ml) ml.classList.toggle('checked', checked);
  });
  if (checked !== wasChecked) bumpDevCounter(field, checked ? 1 : -1);
}

// Adjusts the "Corrected: X / Y" / "Tested & Working: X / Y" stat cards in place —
// only the checked count (X) ever changes from a toggle, never the total (Y), so this
// avoids re-rendering the whole dashboard for a single checkbox click.
function bumpDevCounter(field, delta) {
  const el = document.getElementById(field === 'tested_ok' ? 'dev-tested-count' : 'dev-corrected-count');
  if (!el) return;
  const [checkedStr, totalStr] = el.textContent.split('/');
  const checkedNum = (parseInt(checkedStr, 10) || 0) + delta;
  el.textContent = checkedNum + ' / ' + (totalStr || '0').trim();
}

function renderDashboard(rows) {
  const n = rows.length;

  /* ── Collect all TC IDs ── */
  const idSet = new Set();
  rows.forEach(r => { if (r.answers) Object.keys(r.answers).forEach(k => idSet.add(k)); });
  const tcIds = sortTCIds([...idSet]);

  /* ── Stat cards ── */
  const platforms = {};
  let totalPass = 0, totalFail = 0, totalSkip = 0, totalAnswered = 0;
  rows.forEach(r => {
    const p = r.platform || 'Unknown';
    platforms[p] = (platforms[p] || 0) + 1;
    Object.values(r.answers || {}).forEach(v => {
      totalAnswered++;
      if (v === 'pass') totalPass++;
      else if (v === 'fail') totalFail++;
      else if (v === 'skip') totalSkip++;
    });
  });
  const passRate   = totalAnswered > 0 ? Math.round(totalPass / totalAnswered * 100) + '%' : '—';
  // Donut chart stops for the pass-rate card, same pass/skip/fail colors as the TC bars.
  const passDeg = totalAnswered > 0 ? totalPass / totalAnswered * 360 : 0;
  const skipDeg = totalAnswered > 0 ? passDeg + (totalSkip / totalAnswered * 360) : 0;
  const topPlat    = Object.entries(platforms).sort((a, b) => b[1] - a[1])[0]?.[0] || '—';
  const platCount  = Object.keys(platforms).length;

  /* ── Notes by TC (built first so bar rows can embed inline notes) ── */
  const notesByTC = {};
  rows.forEach(r => {
    Object.entries(r.notes || {}).forEach(([id, txt]) => {
      if (!txt?.trim()) return;
      if (!notesByTC[id]) notesByTC[id] = [];
      notesByTC[id].push({ tester: r.tester, platform: r.platform, submitted_at: r.submitted_at, text: txt });
    });
  });

  /* ── TC bar rows ── */
  let bars = '';
  const barsVkey = questionsVersionKey();
  const barsQMap = tcQuestionsByVersion[barsVkey] || {};
  // Running totals for the "Corrected" / "Tested & Working" stat cards below — counts
  // every individual checkbox rendered (per-note ones count separately), not just rows.
  let totalCorrected = 0, checkedCorrected = 0, totalTested = 0, checkedTested = 0;
  tcIds.forEach(id => {
    let pass = 0, fail = 0, skip = 0;
    rows.forEach(r => {
      const v = r.answers?.[id];
      if (v === 'pass') pass++;
      else if (v === 'fail') fail++;
      else if (v === 'skip') skip++;
    });
    const tot = (pass + fail + skip) || 1;
    const pw = Math.round(pass/tot*100), fw = Math.round(fail/tot*100), sw = Math.round(skip/tot*100);
    const qText = questionsLoadedFor[barsVkey] ? esc(barsQMap[id] || '—') : '';
    const tcNoteEntries = notesByTC[id] || [];

    // One "I've corrected this in the app" checkbox per individual note (each note is
    // a separate tester's separate submission, so each gets acknowledged separately).
    const rowNotesHtml = tcNoteEntries.map(e => {
      const noteKey = `${e.tester||''}__${e.platform||''}__${e.submitted_at||''}`;
      const noteChecked = !!(devStatus[`${id}__${noteKey}`] && devStatus[`${id}__${noteKey}`].corrected);
      totalCorrected++;
      if (noteChecked) checkedCorrected++;
      return `<div class="tc-note-item">` +
        `<div class="tc-note-meta">${esc(maskName(e.tester||'Unknown'))} · ${esc(e.platform||'—')} · ${fmtDate(e.submitted_at)}</div>` +
        `<div class="tc-note-text">${esc(e.text)}</div>` +
        `<label class="tc-ack-check${noteChecked ? ' checked' : ''}"><input type="checkbox" ${noteChecked ? 'checked' : ''} data-tc="${esc(id)}" data-note="${esc(noteKey)}" data-field="corrected" onchange="toggleAck(this)"/> I've corrected this in the app</label>` +
        `</div>`;
    }).join('');

    // Row-level status checkboxes — only for TCs with something to respond to (a fail,
    // or notes). The acknowledgment checkbox only appears here (once for the whole row)
    // when there's a fail but zero notes — when notes exist, acknowledgment happens per
    // note above instead, so it isn't duplicated. "Tested and working well" is always a
    // single row-level flag regardless of notes, stored under note_key ''.
    const hasIssue = fail > 0 || tcNoteEntries.length > 0;
    const rowDevStatus = devStatus[`${id}__`] || {};
    let statusChecksHtml = '';
    if (hasIssue) {
      let rowAckHtml = '';
      if (tcNoteEntries.length === 0) {
        const rowAckChecked = !!rowDevStatus.corrected;
        totalCorrected++;
        if (rowAckChecked) checkedCorrected++;
        rowAckHtml = `<label class="tc-status-check${rowAckChecked ? ' checked' : ''}"><input type="checkbox" ${rowAckChecked ? 'checked' : ''} data-tc="${esc(id)}" data-note="" data-field="corrected" onchange="toggleAck(this)"/> I've corrected this in the app</label>`;
      }
      const testedChecked = !!rowDevStatus.tested_ok;
      totalTested++;
      if (testedChecked) checkedTested++;
      statusChecksHtml = `<div class="tc-status-checks">
        ${rowAckHtml}
        <label class="tc-status-check${testedChecked ? ' checked' : ''}"><input type="checkbox" ${testedChecked ? 'checked' : ''} data-tc="${esc(id)}" data-note="" data-field="tested_ok" onchange="toggleAck(this)"/> Tested and working well</label>
      </div>`;
    }

    bars += `<div class="tc-row">
      <div class="tc-row-id">${esc(id)}</div>
      <div class="tc-bar-wrap">
        <div class="tc-bar-seg tc-bar-pass" style="width:${pw}%"></div>
        <div class="tc-bar-seg tc-bar-skip" style="width:${sw}%"></div>
        <div class="tc-bar-seg tc-bar-fail" style="width:${fw}%"></div>
      </div>
      <div class="tc-counts">
        <span class="cnt-pass">✓ ${pass}</span>
        <span class="cnt-skip">– ${skip}</span>
        <span class="cnt-fail">✗ ${fail}</span>
      </div>
      <button class="show-q-btn row-q-btn" onclick="toggleRowQuestion(this)">Q</button>
      <button class="show-q-btn row-notes-btn" ${tcNoteEntries.length ? `data-count="${tcNoteEntries.length}" onclick="toggleRowNotes(this)"` : 'disabled'}>Remark${tcNoteEntries.length ? ` (${tcNoteEntries.length})` : ''}</button>
      <div class="tc-question" data-id="${esc(id)}">${qText}</div>
      ${tcNoteEntries.length ? `<div class="tc-notes">${rowNotesHtml}</div>` : ''}
      ${statusChecksHtml}
    </div>`;
  });

  const stats = `<div class="stat-row">
    <div class="stat-card">
      <div class="stat-value">${n}</div>
      <div class="stat-label">Total Submissions</div>
    </div>
    <div class="stat-card stat-card-pie">
      <div class="pie-donut" style="background:conic-gradient(var(--pass) 0deg ${passDeg}deg, var(--skip) ${passDeg}deg ${skipDeg}deg, var(--fail) ${skipDeg}deg 360deg)" title="Pass ${totalPass} · N/A ${totalSkip} · Fail ${totalFail}">
        <div class="pie-donut-center">${passRate}</div>
      </div>
      <div class="stat-label">Overall Pass Rate</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${platCount}</div>
      <div class="stat-label">Platforms Tested</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="font-size:${topPlat.length > 10 ? '13px' : '18px'};padding-top:6px">${esc(topPlat)}</div>
      <div class="stat-label">Top Platform</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="dev-corrected-count">${checkedCorrected} / ${totalCorrected}</div>
      <div class="stat-label">Corrected</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="dev-tested-count">${checkedTested} / ${totalTested}</div>
      <div class="stat-label">Tested &amp; Working</div>
    </div>
  </div>`;

  /* ── Notes ── */
  const noteIds = sortTCIds(Object.keys(notesByTC));
  let noteSections = '';
  if (noteIds.length === 0) {
    noteSections = '<div style="padding:12px 16px;font-size:12px;color:var(--text2)">No remarks recorded yet.</div>';
  } else {
    noteIds.forEach(id => {
      const entries = notesByTC[id];
      const items = entries.map(e => {
        const noteKey = `${e.tester||''}__${e.platform||''}__${e.submitted_at||''}`;
        const noteChecked = !!(devStatus[`${id}__${noteKey}`] && devStatus[`${id}__${noteKey}`].corrected);
        return `<div class="note-block">
          <div class="note-meta">${esc(maskName(e.tester||'Unknown'))} · ${esc(e.platform||'—')} · ${fmtDate(e.submitted_at)}</div>
          <div class="note-text">${esc(e.text)}</div>
          <label class="tc-ack-check${noteChecked ? ' checked' : ''}"><input type="checkbox" ${noteChecked ? 'checked' : ''} data-tc="${esc(id)}" data-note="${esc(noteKey)}" data-field="corrected" onchange="toggleAck(this)"/> I've corrected this in the app</label>
        </div>`;
      }).join('');
      const noteQ = barsQMap[id] ? esc(barsQMap[id]) : '';
      const testedChecked = !!(devStatus[`${id}__`] && devStatus[`${id}__`].tested_ok);
      noteSections += `<div class="notes-group">
        <div class="notes-group-hdr">
          <div class="notes-group-hdr-top">${esc(id)} <span class="hdr-count">${entries.length}</span></div>
          ${noteQ ? `<div class="notes-group-q">${noteQ}</div>` : ''}
        </div>
        ${items}
        <div class="note-block note-block-tested">
          <label class="tc-ack-check${testedChecked ? ' checked' : ''}"><input type="checkbox" ${testedChecked ? 'checked' : ''} data-tc="${esc(id)}" data-note="" data-field="tested_ok" onchange="toggleAck(this)"/> Tested and working well</label>
        </div>
      </div>`;
    });
  }

  /* ── All submissions table ── */
  let trows = '';
  rows.forEach(r => {
    let pass = 0, fail = 0, skip = 0;
    Object.values(r.answers || {}).forEach(v => {
      if (v === 'pass') pass++;
      else if (v === 'fail') fail++;
      else if (v === 'skip') skip++;
    });
    trows += `<tr>
      <td><span class="tester-name">${esc(maskName(r.tester||'—'))}</span></td>
      <td>${esc(r.platform||'—')}</td>
      <td>${esc(r.display||'—')}</td>
      <td>${esc(r.version||'—')}</td>
      <td style="color:var(--text2)">${fmtDate(r.submitted_at)}</td>
      <td><span class="badge badge-pass">✓ ${pass}</span></td>
      <td><span class="badge badge-skip">– ${skip}</span></td>
      <td><span class="badge badge-fail">✗ ${fail}</span></td>
    </tr>`;
  });

  // Pin stat bar below header
  const statBar = document.getElementById('stat-bar');
  const statBarInner = document.getElementById('stat-bar-inner');
  statBarInner.innerHTML = stats;
  statBar.style.top = document.getElementById('header').offsetHeight + 'px';
  statBar.style.display = 'block';

  document.getElementById('dashboard').innerHTML = `
    <div class="dash-section ${questionsShown ? 'questions-on' : ''} ${notesShown ? 'notes-on' : ''}" id="tc-results-section">
      <div class="dash-section-hdr">TC Results <span class="hdr-count">${n} submission${n!==1?'s':''}</span><div class="hdr-btn-group"><button class="show-q-btn ${questionsShown ? 'active' : ''}" id="show-q-btn" onclick="toggleQuestions()">${questionsShown ? 'Hide Questions' : 'Show Questions'}</button><button class="show-q-btn ${notesShown ? 'active' : ''}" id="show-notes-btn" onclick="toggleAllNotes()">${notesShown ? 'Hide Remarks' : 'Show Remarks'}</button></div></div>
      ${bars}
    </div>
    <div class="dash-section" id="section-remarks">
      <div class="dash-section-hdr">Remarks</div>
      ${noteSections}
    </div>
    <div class="dash-section" id="section-all-submissions">
      <div class="dash-section-hdr">All Submissions <span class="hdr-count">${n}</span></div>
      <div class="tbl-wrap">
        <table class="sub-table">
          <thead><tr>
            <th>Tester</th><th>Platform</th><th>Display</th><th>Version</th><th>Submitted</th>
            <th>Pass</th><th>N/A</th><th>Fail</th>
          </tr></thead>
          <tbody>${trows}</tbody>
        </table>
      </div>
    </div>`;
  document.getElementById('dashboard').style.display = 'block';
}

/* ── PDF ── */
function pdfTimestampText() {
  const when = new Date().toLocaleString('en-GB', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  return `Generated: ${when}`;
}
function showPrintDialog() {
  return new Promise(resolve => {
    const modal = document.getElementById('print-scope-modal');
    modal.style.display = 'flex';
    function done(val) { modal.style.display = 'none'; resolve(val); }
    document.getElementById('psc-whole').onclick = () => done('whole');
    document.getElementById('psc-section').onclick = () => done('section');
    document.getElementById('psc-cancel').onclick = () => done(null);
    document.getElementById('print-scope-backdrop').onclick = () => done(null);
  });
}
async function savePDF() {
  const scope = await showPrintDialog();
  if (!scope) return;
  const ts = document.getElementById('pdf-timestamp');
  if (ts) ts.textContent = pdfTimestampText();
  const prev = document.title;
  document.title = `EagleView_QA_Dashboard_${new Date().toISOString().slice(0,10)}`;
  if (scope === 'section') document.body.classList.add('print-main-only');
  window.print();
  if (scope === 'section') document.body.classList.remove('print-main-only');
  document.title = prev;
  if (ts) ts.textContent = '';
}
async function savePDFDirect(btn) {
  const scope = await showPrintDialog();
  if (!scope) return;
  if (!window.html2canvas || !window.jspdf) { alert('PDF library not loaded.'); return; }
  const orig = btn.textContent;
  btn.textContent = '⏳ Generating…'; btn.disabled = true;
  try {
    const prevScrollY = window.scrollY;
    const tsEl = document.getElementById('pdf-timestamp');
    const overrideStyle = document.createElement('style');
    overrideStyle.id = 'pdf-cap-override';
    let hideCSS = '#header{display:none!important}';
    if (scope === 'section') hideCSS += '#tester-panel{display:none!important}#section-all-submissions{display:none!important}';
    overrideStyle.textContent = hideCSS;
    let canvas;
    try {
      if (tsEl) { tsEl.textContent = pdfTimestampText(); tsEl.style.display = 'block'; }
      window.scrollTo(0, 0);
      document.head.appendChild(overrideStyle);
      await new Promise(r => setTimeout(r, 200));
      canvas = await html2canvas(document.body, {
        scale: 2, useCORS: true, allowTaint: false, logging: false,
        scrollX: 0, scrollY: 0,
        windowWidth: document.body.offsetWidth,
        windowHeight: document.body.scrollHeight
      });
    } finally {
      if (tsEl) { tsEl.textContent = ''; tsEl.style.display = ''; }
      window.scrollTo(0, prevScrollY);
      overrideStyle.remove();
    }
    if (!canvas) return;
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pW = pdf.internal.pageSize.getWidth();
    const pH = pdf.internal.pageSize.getHeight();
    const img = canvas.toDataURL('image/jpeg', 0.95);
    const iH = canvas.height * pW / canvas.width;
    let y = 0;
    pdf.addImage(img, 'JPEG', 0, y, pW, iH);
    let rem = iH - pH;
    while (rem > 0) { y -= pH; pdf.addPage(); pdf.addImage(img, 'JPEG', 0, y, pW, iH); rem -= pH; }
    pdf.save(`EagleView_QA_Dashboard_${new Date().toISOString().slice(0,10)}.pdf`);
  } catch(e) {
    alert('PDF failed: ' + e.message);
  } finally {
    btn.textContent = orig; btn.disabled = false;
  }
}

document.getElementById('header').addEventListener('dblclick', function(e) {
  if (e.target.closest('button')) return;
  toggleUserHide();
});

loadData();
</script>
</body>
